env: dev
timezone: UTC

database:
  path: data/chamiclaw.db

apis:
  gamma_base: https://gamma-api.polymarket.com
  clob_base: https://clob.polymarket.com
  clob_profile: default
  clob_endpoints:
    submit_order: /orders
    order_status: /orders/{order_id}
    cancel_order: /orders/{order_id}/cancel
    orderbook: /book?market={market_id}
    positions: /positions
  clob_field_map: {}

scan:
  interval_sec: 20
  min_liquidity_usd: 120000
  min_depth_usd: 25000
  min_time_to_expiry_min: 180
  max_time_to_expiry_days: 30
  max_markets_per_scan: 180
  max_cycle_runtime_sec: 20
  enable_orderbook: true
  orderbook_for_tradable_only: false
  max_orderbook_calls_per_cycle: 35
  orderbook_path_template: /book?market={market_id}
  orderbook_timeout_sec: 6

signal:
  require_structural_signal: true
  disable_llm_only_entry: true
  enforce_structural_min_edge_bps: 280
  enforce_min_edge_after_cost_bps: 120
  enter_edge_bps: 180
  llm_enter_edge_bps: 200
  min_llm_enter_edge_bps: 150
  research_relaxation_bps: 0
  live_llm_enter_edge_bps: 40
  exit_edge_bps: 120
  no_trade_zone_bps: 110
  min_confidence: 0.65
  min_confidence_floor: 0.5
  research_confidence_relax: 0
  live_min_confidence: 0.60
  trading_fee_pct: 0.02
  slippage_bps: 40
  assumed_order_notional_usd: 80
  chain_cost_bps: 0
  net_edge_cost_mode: fixed_200_40_plus_half_spread
  enable_cross_market_signal: true
  cross_market_gap_bps: 140
  enable_term_structure_signal: true
  term_structure_gap_bps: 120
  structural_conflict_gap_bps: 160

risk:
  account_equity_usd: 10000
  per_market_pos_pct: 0.02
  event_cluster_exposure_pct: 0.15
  daily_max_drawdown_pct: 0.04
  max_spread_bps: 320
  pre_expiry_add_position_block_min: 180
  max_open_orders_per_market: 1

execution:
  backend: py-clob-client
  signature_type: 0
  api_creds_cache_path: data/polymarket_api_creds.json
  limit_order_only: true
  order_timeout_sec: 15
  poll_interval_sec: 2
  request_timeout_sec: 10
  min_reprice_interval_sec: 4
  max_retries: 1
  dry_run: true

llm:
  single_llm_mode: true
  mode: http
  request_timeout_sec: 8
  max_retries: 1
  llm1_endpoint: "https://api.siliconflow.cn/v1/chat/completions"
  llm2_endpoint: ""
  llm1_model: "deepseek-ai/DeepSeek-V3.2"
  llm2_model: "deepseek-ai/DeepSeek-V3.2"
  api_key_env: CHAMICLAW_LLM_API_KEY

ops:
  discord_webhook: ""
  llm_degrade_pause_threshold: 5

market_making:
  enabled: true
  baseline_mode: true
  min_spread_bps: 40
  min_market_liquidity_usd: 100000
  inventory_threshold_pct: 0.02
  per_market_exposure_pct: 0.06
  total_exposure_pct: 0.30
  pause_after_consecutive_losses: 2
  pause_minutes: 30
  mm_cooldown_sec: 60
  mid_move_pause_bps: 150
  use_llm_fair_prob: true

reconcile:
  interval_sec: 200
  exchange_positions_endpoint: ""
  qty_tolerance: 0.0001
  pause_mismatch_threshold: 1
  auto_repair_local: true
  timeout_sec: 10

go_no_go:
  min_recent_cycles: 3
  min_recent_signals: 1
  min_edge_sample_size: 30
  min_edge_positive_ratio: 0.08
  max_llm_degrade_rate: 0.2

evaluate:
  paper_horizons_min: [5, 30, 1440]
  calibration_bucket_width: 0.05
  calibration_method: isotonic
  backtest_queue_delay_quotes: 1
  backtest_slippage_bps: 10
