services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chamiclaw:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHAMICLAW_LOAD_DOTENV: "false"
      REPOSITORY_BACKEND: sqlite
      SQLITE_PATH: /app/data/chamiclaw_t1.db
      PARAMS_PATH: /app/data/strategy_params.json
      SCHEDULER_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
